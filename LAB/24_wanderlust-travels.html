<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Wanderlust Travels</title><style>
:root{--c:#2563eb;--bg:#f4f6fb;--tx:#1d2330;--cd:#fff;--bd:#d9dde7}@media(prefers-color-scheme:dark){:root{--bg:#12151c;--tx:#e8eaf0;--cd:#1e232e;--bd:#33394a}}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,sans-serif;background:var(--bg);color:var(--tx)}
header{background:var(--c);color:#fff;display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding:12px 20px;position:sticky;top:0;z-index:5}header b{font-size:1.2em;margin-right:auto}
nav a{color:#fff;margin-left:14px;cursor:pointer;font-size:.93em;opacity:.9}nav a:hover{opacity:1;text-decoration:underline}
main{max-width:1000px;margin:20px auto;padding:0 16px;min-height:65vh}footer{text-align:center;padding:20px;opacity:.6;font-size:.85em}
.hero{background:linear-gradient(135deg,var(--c),#000a);color:#fff;border-radius:14px;padding:44px 24px;text-align:center}.hero h1{margin:0 0 8px;font-size:2em}.hero .e{font-size:3em}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px;margin-top:16px}
.card{background:var(--cd);border:1px solid var(--bd);border-radius:12px;padding:14px;transition:.2s}.card:hover{transform:translateY(-3px);box-shadow:0 6px 16px #0003}.card h3{margin:6px 0}
.im{height:90px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:2.6em;background:linear-gradient(135deg,var(--c),#0007)}
.tg{font-size:.75em;background:var(--c);color:#fff;padding:2px 8px;border-radius:10px}.st{color:#e6a700}
input,select,textarea,button{font:inherit;padding:9px;border-radius:8px;border:1px solid var(--bd);margin:4px 0;max-width:100%}
input,select,textarea{background:var(--cd);color:var(--tx);width:100%}button{background:var(--c);color:#fff;border:0;cursor:pointer;width:auto}button:hover{filter:brightness(1.1)}
button.d{background:#c0392b}button.g{background:#6b7280}form,.box{background:var(--cd);border:1px solid var(--bd);padding:16px;border-radius:12px;max-width:460px;margin:14px 0}
.bar{display:flex;gap:8px;flex-wrap:wrap}.bar>*{flex:1;min-width:130px}table{width:100%;border-collapse:collapse;background:var(--cd)}td,th{padding:8px;border-bottom:1px solid var(--bd);text-align:left;font-size:.88em}.w{overflow-x:auto}
.err{color:#c0392b}.ok{color:#1e8449}.stat{text-align:center}.stat b{font-size:1.8em;color:var(--c)}
.mo{position:fixed;inset:0;background:#000a;display:flex;align-items:center;justify-content:center;z-index:20;padding:12px}.md{background:var(--cd);padding:20px;border-radius:12px;max-width:440px;width:100%;max-height:90vh;overflow:auto}
.seats{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}.seats span{padding:8px 0;text-align:center;border:1px solid var(--bd);border-radius:6px;cursor:pointer;font-size:.8em}.seats .t{background:#999;cursor:not-allowed;color:#fff}.seats .s{background:var(--c);color:#fff}
#tt{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#222;color:#fff;padding:10px 18px;border-radius:20px;z-index:30;display:none}
.br{height:14px;background:var(--c);border-radius:4px;margin:2px 0}
@media print{body>*:not(.mo){display:none}.mo{position:static;background:none}button{display:none}}</style></head><body><header><b id=br></b><nav id=nav></nav></header><main id=app></main><footer>Wanderlust Travels &middot; Internet Programming Lab</footer><div id=tt></div><script>
const C={"slug": "wanderlust-travels", "title": "Wanderlust Travels", "tag": "Packages, hotels and routes.", "noun": "Package", "verb": "Book", "role": "Traveller", "seed": ["Kodaikanal Trip", "Goa Package", "Kerala Backwaters", "Ooty Getaway"], "calc": "", "mod": "", "ico": "\ud83e\uddf3"},K='ipl2_'+C.slug,CATS=['Popular','New','Offer'];
let S=JSON.parse(localStorage.getItem(K)||'null')||{users:[{u:'admin',p:'admin123',role:'Admin',name:'Administrator',em:'admin@example.com',ph:''}],items:C.seed.map((n,i)=>({id:i+1,name:n,desc:'Details about '+n+'.',price:C.mod=='vote'||C.mod=='quiz'?0:(i+1)*250,cat:CATS[i%3],rv:[]})),recs:[],msgs:[],me:null};
const save=()=>localStorage.setItem(K,JSON.stringify(S)),$=id=>document.getElementById(id),esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const isA=()=>S.me&&S.me.role==='Admin',go=p=>{location.hash=p},today=()=>new Date().toISOString().slice(0,10),NL=String.fromCharCode(10);
function toast(m){const t=$('tt');t.textContent=m;t.style.display='block';setTimeout(()=>t.style.display='none',2600)}
function modal(h){cl();const d=document.createElement('div');d.className='mo';d.innerHTML='<div class=md>'+h+'<p><button class=g onclick="cl()">Close</button></p></div>';document.body.appendChild(d)}
const cl=()=>document.querySelectorAll('.mo').forEach(e=>e.remove());
function nav(){const l=[['home','Home'],['cat',C.noun+'s']];if(S.me&&!isA())l.push(['my','My '+C.verb+'s']);if(C.calc)l.push(['calc','Calculator']);if(C.mod=='quiz'||C.mod=='vote')l.push(['res','Results']);if(isA())l.push(['adm','Admin']);l.push(['info','About &amp; FAQ'],['con','Contact']);
$('nav').innerHTML=l.map(x=>`<a onclick="go('${x[0]}')">${x[1]}</a>`).join('')+(S.me?`<a onclick="go('prof')">${esc(S.me.u)}</a><a onclick="S.me=null;save();go('home');render()">Logout</a>`:`<a onclick="go('login')">Login</a><a onclick="go('reg')">Register</a>`)}
const avg=i=>i.rv.length?(i.rv.reduce((a,r)=>a+r.r,0)/i.rv.length).toFixed(1):0;
function items(){const q=($('q')?$('q').value:'').toLowerCase(),c=$('fc')?$('fc').value:'',s=$('so')?$('so').value:'';let l=S.items.filter(i=>(i.name+i.desc).toLowerCase().includes(q)&&(!c||i.cat==c));if(s=='a')l.sort((a,b)=>a.price-b.price);if(s=='d')l.sort((a,b)=>b.price-a.price);if(s=='r')l.sort((a,b)=>avg(b)-avg(a));
return l.map(i=>`<div class=card><div class=im>${C.ico}</div><h3>${esc(i.name)}</h3><span class=tg>${i.cat}</span><p>${esc(i.desc)}</p><p class=st>${'&#9733;'.repeat(Math.round(avg(i)))||'No ratings'} <small>(${i.rv.length})</small></p>${i.price?`<p><b>&#8377;${i.price}</b></p>`:''}<button onclick="act(${i.id})">${C.verb}</button> <button class=g onclick="rev(${i.id})">Reviews</button></div>`).join('')||'<p>No results found.</p>'}
function rev(id){const i=S.items.find(x=>x.id==id);modal(`<h3>${esc(i.name)} reviews</h3>`+(i.rv.map(r=>`<p><span class=st>${'&#9733;'.repeat(r.r)}</span> ${esc(r.t)} <small>- ${esc(r.u)}</small></p>`).join('')||'<p>No reviews yet.</p>')+(S.me&&!isA()?`<form onsubmit="return addRev(this,${id})"><select name=r><option>5</option><option>4</option><option>3</option><option>2</option><option>1</option></select><input name=t placeholder="Write a review" required><button>Submit</button></form>`:'<small>Login as user to review.</small>'))}
function addRev(f,id){S.items.find(x=>x.id==id).rv.push({r:+f.r.value,t:f.t.value,u:S.me.u});save();cl();toast('Review added');render();return false}
const taken=(i,s)=>S.recs.some(r=>r.item==i.name&&r.seat==s&&r.st!='Cancelled');
function act(id){if(!S.me){toast('Please login first');go('login');return}if(isA()){toast('Use a '+C.role+' account');return}const i=S.items.find(x=>x.id==id);
if(C.mod=='vote'){if(S.recs.some(r=>r.u==S.me.u&&r.mod=='vote'))return toast('You have already voted');if(confirm('Vote for '+i.name+'? This cannot be changed.'))done(i,{d:today(),n:1,note:'Vote cast'},'Paid');return}
if(C.mod=='quiz'){window.EX=i.name;go('quiz');return}
let sh='';if(C.mod=='seat'){sh='<p>Select seat:</p><div class=seats>'+Array.from({length:24},(_,k)=>k+1).map(s=>`<span class="${taken(i,s)?'t':''}" onclick="pick(this,${s},${taken(i,s)})">${s}</span>`).join('')+'</div><input type=hidden id=seat>'}
modal(`<h3>${C.verb}: ${esc(i.name)}</h3><form style="border:0;padding:0" onsubmit="return step(this,${id})"><label>Date</label><input name=d type=date min="${today()}" value="${today()}" required>${C.mod=='seat'?'':'<label>Quantity / persons</label><input name=n type=number min=1 value=1 required>'}<input name=note placeholder="Notes / address (optional)">${sh}<button>Continue</button></form>`)}
function pick(e,s,t){if(t)return;document.querySelectorAll('.seats .s').forEach(x=>x.className='');e.className='s';$('seat').value=s}
function step(f,id){const i=S.items.find(x=>x.id==id),d={d:f.d.value,n:C.mod=='seat'?1:+f.n.value,note:f.note.value,seat:C.mod=='seat'?$('seat').value:''};if(C.mod=='seat'&&!d.seat){toast('Select a seat');return false}
if(!i.price){done(i,d,'Free');return false}const tot=i.price*d.n;window.PD=[i,d];
modal(`<h3>Payment</h3><p>${esc(i.name)} x ${d.n}${d.seat?' | Seat '+d.seat:''}<br><b>Total: &#8377;${tot}</b></p><form style="border:0;padding:0" onsubmit="return pay(this)"><select name=m onchange="$('cd').style.display=this.value=='Cash'?'none':'block'"><option>Credit/Debit Card</option><option>UPI</option><option>Net Banking</option><option>Cash</option></select><div id=cd><input name=c placeholder="Card / UPI ID / Account (demo)" minlength=6></div><button>Pay &#8377;${tot}</button></form><small>Demo gateway: no real payment.</small>`);return false}
function pay(f){if(f.m.value!='Cash'&&f.c.value.length<6){toast('Enter payment details');return false}done(PD[0],PD[1],'Paid via '+f.m.value);return false}
function done(i,d,p){const r={id:Date.now(),rid:'R'+Math.floor(Math.random()*9e5+1e5),u:S.me.u,item:i.name,price:i.price*d.n,note:(d.note||'')+(d.seat?' Seat '+d.seat:'')+' Qty '+d.n,seat:d.seat||'',date:d.d,st:p=='Paid'||p=='Free'?'Confirmed':'Confirmed',pay:p,mod:C.mod};if(C.mod=='fine'){const x=new Date(d.d);x.setDate(x.getDate()+14);r.due=x.toISOString().slice(0,10)}S.recs.push(r);save();render();receipt(r.id)}
function receipt(id){const r=S.recs.find(x=>x.id==id);modal(`<h3>${C.title} - Receipt</h3><p>No: <b>${r.rid}</b><br>${esc(r.item)}<br>User: ${esc(r.u)}<br>Date: ${r.date}${r.due?'<br>Due: '+r.due:''}<br>${esc(r.note)}<br>Amount: &#8377;${r.price} (${r.pay})<br>Status: ${r.st}</p>${C.mod=='qr'?'<canvas id=qr width=140 height=140></canvas><br><small>Show this QR to the conductor / gate</small>':''}<button onclick="window.print()">Print</button>`);if(C.mod=='qr')qr(r.rid)}
function qr(s){const c=$('qr').getContext('2d');let h=0;for(const ch of s)h=(h*31+ch.charCodeAt(0))>>>0;c.fillStyle='#fff';c.fillRect(0,0,140,140);c.fillStyle='#000';for(let y=0;y<20;y++)for(let x=0;x<20;x++){h=(h*1103515245+12345)>>>0;const f=(x<5&&y<5)||(x>14&&y<5)||(x<5&&y>14);if(f?(x%4!=0&&y%4!=0||x==0||y==0||x==4||y==4||x==15||x==19||y==15||y==19):(h>>16)&1)c.fillRect(x*7,y*7,7,7)}}
function table(rs,adm){const L=C.mod=='fine';return `<div class=w><table><tr><th>No</th><th>${C.noun}</th>${adm?'<th>User</th>':''}<th>Details</th><th>Amount</th><th>Date</th>${L?'<th>Due/Fine</th>':''}<th>Status</th><th></th></tr>`+rs.map(r=>`<tr><td>${r.rid}</td><td>${esc(r.item)}</td>${adm?`<td>${esc(r.u)}</td>`:''}<td>${esc(r.note)}</td><td>&#8377;${r.price}</td><td>${r.date}</td>${L?`<td>${r.due||''}${r.fine?' / &#8377;'+r.fine:''}</td>`:''}<td>${adm&&r.mod!='quiz'?`<select onchange="setSt(${r.id},this.value)">${['Pending','Confirmed','Approved','Completed','Cancelled','Returned'].map(s=>`<option ${s==r.st?'selected':''}>${s}</option>`).join('')}</select>`:r.st}</td><td>${r.mod!='quiz'?`<button class=g onclick="receipt(${r.id})">Receipt</button>`:''}${adm&&L&&r.st!='Returned'?` <button onclick="ret(${r.id})">Return</button>`:''}${!adm&&r.st=='Confirmed'&&r.mod!='vote'&&r.mod!='quiz'?` <button class=d onclick="if(confirm('Cancel?'))setSt(${r.id},'Cancelled')">Cancel</button>`:''}</td></tr>`).join('')+'</table></div>'}
function setSt(id,s){S.recs.find(r=>r.id==id).st=s;save();render()}
function ret(id){const r=S.recs.find(x=>x.id==id),d=prompt('Return date (YYYY-MM-DD)',today());if(!d)return;const late=Math.max(0,Math.round((new Date(d)-new Date(r.due))/864e5));r.fine=late*5;r.st='Returned';save();toast('Fine: Rs '+r.fine);render()}
function stats(){const rev=S.recs.filter(r=>r.st!='Cancelled').reduce((a,r)=>a+r.price,0),by={};S.recs.forEach(r=>by[r.st]=(by[r.st]||0)+1);const m=Math.max(1,...Object.values(by));
return `<div class=grid><div class="card stat"><b>${S.items.length}</b><br>${C.noun}s</div><div class="card stat"><b>${S.users.length}</b><br>Users</div><div class="card stat"><b>${S.recs.length}</b><br>${C.verb}s</div><div class="card stat"><b>&#8377;${rev}</b><br>Revenue</div></div><div class=box style="max-width:none"><b>Status chart</b>${Object.entries(by).map(([k,v])=>`<div>${k} (${v})<div class=br style="width:${v/m*100}%"></div></div>`).join('')||'<p>No data</p>'}</div>`}
function ranks(){const q=S.recs.filter(r=>r.mod=='quiz').sort((a,b)=>b.score-a.score);return `<div class=w><table><tr><th>Rank</th><th>Candidate</th><th>Exam</th><th>Score</th><th>Result</th></tr>${q.map((r,i)=>`<tr><td>${i+1}</td><td>${esc(r.u)}</td><td>${esc(r.item)}</td><td>${r.score}/5</td><td>${r.st}</td></tr>`).join('')}</table></div>`}
function votes(){return `<div class=box style="max-width:none">`+S.items.map(i=>{const n=S.recs.filter(r=>r.mod=='vote'&&r.item==i.name).length;return `<div>${esc(i.name)}: ${n}<div class=br style="width:${Math.min(100,n*10)}%"></div></div>`}).join('')+'</div>'}
const QZ=[['2, 4, 8, 16, ?',['24','32','30','20'],1],['Output of 5*(2+3)?',['25','13','15','20'],0],['HTML stands for?',['Hyper Text Markup Language','High Tool ML','Home Text Language','Hyper Tab ML'],0],['Synonym of "rapid"?',['Slow','Quick','Late','Calm'],1],['CSS is used for?',['Database','Styling','Networking','Compiling'],1]];
const P={
home:()=>`<div class=hero><div class=e>${C.ico}</div><h1>${C.title}</h1><p>${C.tag}</p><button style="background:#fff;color:#222" onclick="go('cat')">Explore ${C.noun}s</button></div><div class=grid><div class=card><h3>${C.role}</h3><p>Register, search, ${C.verb.toLowerCase()} and track status online.</p></div><div class=card><h3>Admin</h3><p>Manage ${C.noun.toLowerCase()}s, users and reports. Demo: admin / admin123</p></div><div class=card><h3>Secure &amp; Responsive</h3><p>Works on mobile, tablet and desktop.</p></div></div>`,
cat:()=>`<h2>${C.noun}s</h2><div class=bar><input id=q placeholder="Search..." oninput="$('lst').innerHTML=items()"><select id=fc onchange="$('lst').innerHTML=items()"><option value="">All categories</option>${CATS.map(c=>`<option>${c}</option>`).join('')}</select><select id=so onchange="$('lst').innerHTML=items()"><option value="">Sort</option><option value=a>Price low-high</option><option value=d>Price high-low</option><option value=r>Top rated</option></select></div><div class=grid id=lst>${items()}</div>`,
my:()=>!S.me?P.login():`<h2>My ${C.verb}s</h2>${table(S.recs.filter(r=>r.u==S.me.u&&r.mod!='quiz'))}${C.mod=='quiz'?'<h3>My Results</h3>'+ranks():''}`,
adm:()=>{if(!isA())return '<p class=err>Admin access only.</p>';return `<h2>Admin Dashboard</h2>${stats()}<form onsubmit="return addI(this)"><b>Add ${C.noun}</b><input name=n placeholder=Name required><input name=d placeholder=Description><input name=p type=number min=0 placeholder=Price required><select name=c>${CATS.map(c=>`<option>${c}</option>`).join('')}</select><button>Add</button></form><h3>${C.noun}s</h3><div class=w><table>${S.items.map(i=>`<tr><td>${esc(i.name)}</td><td>${i.cat}</td><td>&#8377;${i.price}</td><td><button onclick="editI(${i.id})">Edit</button> <button class=d onclick="delI(${i.id})">Delete</button></td></tr>`).join('')}</table></div><h3>All ${C.verb}s</h3><button class=g onclick="csv()">Export CSV</button>${table(S.recs.filter(r=>r.mod!='quiz'),1)}${C.mod=='quiz'?'<h3>Exam results</h3>'+ranks():''}${C.mod=='vote'?'<h3>Live count</h3>'+votes():''}<h3>Users</h3><div class=w><table>${S.users.map(u=>`<tr><td>${esc(u.u)}</td><td>${u.role}</td><td>${esc(u.name)}</td><td>${esc(u.em||'')}</td><td>${u.u!='admin'?`<button class=d onclick="delU('${u.u}')">Remove</button>`:''}</td></tr>`).join('')}</table></div><h3>Messages</h3>${S.msgs.map(m=>`<div class=box><b>${esc(m.n)}</b> (${esc(m.e)}): ${esc(m.m)}</div>`).join('')||'<p>None.</p>'}`},
res:()=>C.mod=='vote'?'<h2>Election Results</h2>'+(isA()||S.recs.some(r=>r.mod=='vote'&&r.u==(S.me||{}).u)?votes():'<p>Cast your vote to view live results.</p>'):'<h2>Ranking List</h2>'+ranks(),
quiz:()=>{if(!S.me||isA())return P.login();if(!window.EX)return '<p>Choose an exam from the list first.</p>';return `<h2>${esc(EX)}</h2><form style="max-width:640px" onsubmit="return sub(this)">${QZ.map((q,i)=>`<p><b>${i+1}. ${q[0]}</b></p>${q[1].map((o,j)=>`<label><input type=radio name=q${i} value=${j} style="width:auto" required> ${o}</label><br>`).join('')}`).join('')}<button>Submit exam</button></form>`},
prof:()=>!S.me?P.login():`<h2>My Profile</h2><form onsubmit="return upd(this)"><input name=nm value="${esc(S.me.name)}" required><input name=em type=email value="${esc(S.me.em||'')}" placeholder=Email><input name=ph value="${esc(S.me.ph||'')}" placeholder="Phone (10 digits)" pattern="[0-9]{10}"><input name=pw type=password placeholder="New password (optional)" minlength=6><button>Save</button></form>`,
info:()=>`<h2>About ${C.title}</h2><div class=box style="max-width:none"><p>${C.tag} Built as part of the Internet Programming Lab.</p></div><h3>FAQ</h3><div class=box style="max-width:none"><p><b>How do I register?</b><br>Click Register, fill the form and login.</p><p><b>Is my data safe?</b><br>This demo stores data only in your browser.</p><p><b>How can I cancel?</b><br>Open My ${C.verb}s and press Cancel.</p><p><b>Privacy policy:</b> We collect only the details needed to serve you and never share them.</p></div>`,
con:()=>`<h2>Contact Us</h2><form onsubmit="return msg(this)"><input name=n placeholder="Your name" required><input name=e type=email placeholder=Email required><textarea name=m placeholder=Message required></textarea><button>Send</button></form>`,
login:()=>`<h2>Login</h2><form onsubmit="return lg(this)"><input name=u placeholder=Username required><input name=p type=password placeholder=Password required><button>Login</button> <a onclick="go('forgot')" style="cursor:pointer">Forgot password?</a><p id=er class=err></p><small>Admin demo: admin / admin123</small></form>`,
forgot:()=>`<h2>Reset Password</h2><form onsubmit="return fg(this)"><input name=u placeholder=Username required><input name=e type=email placeholder="Registered email" required><input name=p type=password minlength=6 placeholder="New password" required><button>Reset</button><p id=er class=err></p></form>`,
reg:()=>`<h2>Register (${C.role})</h2><form onsubmit="return rg(this)"><input name=nm placeholder="Full name" required><input name=em type=email placeholder=Email required><input name=ph placeholder="Phone (10 digits)" pattern="[0-9]{10}" required><input name=u placeholder=Username required><input name=p type=password minlength=6 placeholder="Password (min 6)" required><button>Register</button><p id=er class=err></p></form>`,
calc:()=>CALC[C.calc]()};
function sub(f){let s=0;QZ.forEach((q,i)=>{if(+f['q'+i].value==q[2])s++});S.recs.push({id:Date.now(),rid:'E'+Math.floor(Math.random()*9e4+1e4),u:S.me.u,item:EX,price:0,note:'',date:today(),st:s>=3?'Passed':'Failed',score:s,mod:'quiz',pay:''});save();modal(`<h3>Result</h3><p>Score: <b>${s}/5</b> - ${s>=3?'Passed':'Failed'}</p>`);go('res');return false}
function addI(f){S.items.push({id:Date.now(),name:f.n.value,desc:f.d.value,price:+f.p.value,cat:f.c.value,rv:[]});save();toast('Added');render();return false}
function delI(id){if(confirm('Delete?')){S.items=S.items.filter(i=>i.id!=id);save();render()}}
function delU(u){if(confirm('Remove user?')){S.users=S.users.filter(x=>x.u!=u);save();render()}}
function editI(id){const i=S.items.find(x=>x.id==id),n=prompt('Name',i.name);if(n===null)return;const d=prompt('Description',i.desc),p=prompt('Price',i.price);i.name=n||i.name;i.desc=d??i.desc;i.price=p===null||p===''?i.price:+p;save();render()}
function csv(){const t=['No,Item,User,Date,Amount,Status'].concat(S.recs.map(r=>[r.rid,r.item,r.u,r.date,r.price,r.st].join(','))).join(NL),a=document.createElement('a');a.href=URL.createObjectURL(new Blob([t],{type:'text/csv'}));a.download='records.csv';a.click()}
function msg(f){S.msgs.push({n:f.n.value,e:f.e.value,m:f.m.value});save();$('app').innerHTML='<p class=ok>Thanks! Message sent.</p>';return false}
function lg(f){const u=S.users.find(x=>x.u==f.u.value&&x.p==f.p.value);if(!u){$('er').textContent='Invalid username or password';return false}S.me=u;save();go(u.role=='Admin'?'adm':'home');render();toast('Welcome '+u.name);return false}
function rg(f){if(S.users.some(x=>x.u==f.u.value)){$('er').textContent='Username already taken';return false}S.users.push({u:f.u.value,p:f.p.value,role:C.role,name:f.nm.value,em:f.em.value,ph:f.ph.value});save();toast('Registered! Please login');go('login');return false}
function fg(f){const u=S.users.find(x=>x.u==f.u.value&&x.em==f.e.value);if(!u){$('er').textContent='No matching account';return false}u.p=f.p.value;save();toast('Password reset');go('login');return false}
function upd(f){Object.assign(S.me,{name:f.nm.value,em:f.em.value,ph:f.ph.value});if(f.pw.value)S.me.p=f.pw.value;save();toast('Profile saved');return false}
const slab=(n,r)=>{let t=0,a=0;[[100,r[0]],[100,r[1]],[300,r[2]],[1e9,r[3]]].forEach(([w,x])=>{const u=Math.max(0,Math.min(w,n-a));t+=u*x;a+=u});return t};
const CALC={eb:()=>`<h2>Electricity Bill</h2><form onsubmit="return rs(this,()=>{const n=+f.n.value,l=+f.l.value,b=slab(n,f.t.value=='d'?[1,2.5,4,6]:[2,4.5,6,7]);return 'Energy: Rs '+b+' | Fine: Rs '+l*10+' | Total: Rs '+(b+l*10)})"><select name=t><option value=d>Domestic</option><option value=c>Commercial</option></select><input name=n type=number min=0 placeholder="Units consumed" required><input name=l type=number value=0 min=0 placeholder="Days after last date"><button>Calculate</button><p id=res class=ok></p></form>`,
phone:()=>`<h2>Phone Bill Payment</h2><form onsubmit="return rs(this,()=>{const a=+f.a.value,l=+f.l.value;return 'Bill Rs '+a+' + fine Rs '+l*10+' = Rs '+(a+l*10)+' (receipt generated)'})"><input name=a type=number min=1 placeholder="Bill amount" required><input name=l type=number value=0 min=0 placeholder="Days after last date"><select><option>Card</option><option>Net banking</option><option>Wallet</option></select><button>Pay</button><p id=res class=ok></p></form>`,
tax:()=>`<h2>Income Tax Calculator</h2><form onsubmit="return rs(this,()=>{const g=+f.g.value,h=+f.h.value,p=+f.p.value,i=+f.i.value,n=g*12-h*12-50000-Math.min(p*12,150000)-i*12;let t=0;if(n>1e6)t=112500+.3*(n-1e6);else if(n>500000)t=12500+.2*(n-500000);else if(n>250000)t=.05*(n-250000);if(n<=500000)t=0;return 'Net taxable income: Rs '+Math.max(n,0)+' | Tax: Rs '+t+' | Net after tax: Rs '+(g*12-t)+(t>0?' | Tip: invest in pension/insurance to reduce tax':'')})"><input name=g type=number placeholder="Monthly gross pay" required><input name=h type=number value=0 placeholder="Monthly HRA"><input name=p type=number value=0 placeholder="Monthly pension"><input name=i type=number value=0 placeholder="Monthly health insurance"><button>Calculate</button><p id=res class=ok></p></form>`};
function rs(form,fn){window.f=form;$('res').textContent=fn();return false}
function render(){nav();$('br').textContent=C.ico+' '+C.title;document.title=C.title;const h=location.hash.slice(1)||'home';$('app').innerHTML=(P[h]||P.home)()}
addEventListener('hashchange',render);render();
</script></body></html>
